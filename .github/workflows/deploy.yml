name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install SSH key
        uses: shimataro/setup-ssh-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          config: |
            Host deploy
              HostName ${{ secrets.DEPLOY_HOST }}
              User ${{ secrets.DEPLOY_USER }}
              Port ${{ secrets.DEPLOY_PORT || '22' }}
              IdentityFile ~/.ssh/id_rsa

      # Runner-secret values are piped inline as `KEY=value` lines before the
      # remote script: a column-0 heredoc terminator inside an indented YAML
      # block breaks Actions' YAML parse, and env does not survive
      # `ssh deploy bash -s` without forwarding (fixed 2026-11-07).
      - name: Deploy over SSH
        env:
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR || '/app' }}
          SERVICE: ${{ secrets.DEPLOY_COMPOSE_SERVICE || 'web' }}
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          {
            echo "APP_DIR=${APP_DIR}"
            echo "SERVICE=${SERVICE}"
            echo "HEALTH_URL=${HEALTH_URL}"
            echo "REGISTRY_TOKEN=${REGISTRY_TOKEN}"
            echo "DEPLOY_USER=${DEPLOY_USER}"
            cat "$GITHUB_WORKSPACE/.github/deploy/remote.sh"
          } | ssh deploy 'bash -s'
