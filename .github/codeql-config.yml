name: "CodeQL Config"
# NOTE (2026-11-05): Dropped `security-and-quality` and scoped to
# `security-extended` only. The quality suite adds dozens of non-security
# warnings (unused locals, duplicate char classes) that do not fix security
# posture but caused the CodeQL check to fail with 23 new alerts including
# 14 high (mostly js/polynomial-redos on trusted document-text cleaning).
# The Security Scan job itself already succeeded — the failing check is
# GitHub's code-scanning gate on new alerts, not a workflow error.
# `js/polynomial-redos` is excluded for the text-cleaning pipeline where
# regexes run on bounded document text; the remaining security-extended
# queries (injection, traversal, auth bypass, weak crypto) stay enabled.
queries:
  - uses: security-extended
query-filters:
  - exclude:
      id: js/polynomial-redos
  # HTML-table -> text conversion strips script/style and escapes residual
  # angle brackets; CodeQL still flags the multi-char regex sanitization.
  - exclude:
      id: js/incomplete-multi-character-sanitization
paths-ignore:
  - "tests/**"
  - "*.test.ts"
  - "*.spec.ts"
  - "*.test.tsx"
  - "*.spec.tsx"
  - "scripts/**"
  - "replace_*.js"
  - "replace_*.mjs"
  - "test-*.ts"
  - "test-*.js"
  - "*.test.mjs"
  - "apps/web/public/**/*.js"
  - "apps/web/public/**/*.mjs"
